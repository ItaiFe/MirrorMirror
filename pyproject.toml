[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror"
version = "0.1.0"
description = "Mirror, Mirror: a talking LED mirror"
requires-python = ">=3.10"
dependencies = [
    # numpy 2.4 needs Python >= 3.11; 2.2.6 is the newest with cp310 (JetPack 6)
    # aarch64 wheels. 2.4.6 is the Mac venv's (3.11).
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.4.6; python_version >= '3.11'",
    "opencv-python-headless",
    "pillow",
    "pygame",
    "requests",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
# Exact versions tested together (2026-10-17); setup_orin.sh installs once, offline after.
# onnxruntime 1.23.2: the newest with a cp310 (JetPack 6) aarch64 wheel; tested on 3.10 + 3.11.
hw = ["sounddevice==0.5.6", "pyserial==3.5", "onnxruntime==1.23.2"]
# mirror/tts.py uses piper 1.8.0 internals (alignments, PiperConfig.from_dict): keep exact.
# renikud-plus (the default Hebrew G2P) declares Python >= 3.12, and its [cpu] extra
# onnxruntime >= 1.24.2, but it runs on 3.10/3.11 with onnxruntime 1.23.2 (tested). So no
# [cpu] extra (onnxruntime is pinned here), and below 3.12 setup_orin.sh installs it with
# --no-deps --ignore-requires-python; hebrew-num2words is its only other dependency.
tts = ["piper-tts[alignment]==1.8.0", "phonikud==0.4.1", "phonikud-onnx==1.0.6", "huggingface_hub",
       "onnxruntime==1.23.2",
       "renikud-plus==0.5.0; python_version >= '3.12'", "hebrew-num2words==0.1.0"]
# Pocket TTS, the optional voice for both languages (tts.engine = "pocket"; off by
# default). pocket-tts-onnx is not on PyPI and declares Python >= 3.13 plus deps we
# don't use (conikud, espeakng-loader, huggingface-hub) or pin lower (numpy >= 2.5.2,
# onnxruntime >= 1.29.0); its runtime path needs only numpy, onnxruntime and
# sentencepiece and runs on 3.10/3.11 with onnxruntime 1.23.2 (tested). So, like
# renikud-plus, it is installed by setup_orin.sh (and the README) with pip
# --no-deps --ignore-requires-python, pinned to this commit:
#   pocket-tts-onnx @ git+https://github.com/thewh1teagle/pocket-tts-onnx@9860fc0fe0ee5ffb13a4bae2fb99e9bd913acbe5
pocket = ["sentencepiece==0.2.2", "onnxruntime==1.23.2"]
# The MMS Hebrew fallback voice only (tts.he_engine = "mms"). On the Orin, install
# NVIDIA's JetPack torch wheel first: deploy/setup_orin.sh --with-mms.
mms = ["transformers", "torch"]
dev = ["pytest", "responses"]

[project.scripts]
mirror-voice = "mirror.voice_main:main"
mirror-face = "mirror.face.app:main"

[tool.setuptools.packages.find]
include = ["mirror", "mirror.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real TTS model files (skips itself when missing)",
]
filterwarnings = [
    # raised inside torch/transformers when the real MMS model loads; not ours to fix
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]
