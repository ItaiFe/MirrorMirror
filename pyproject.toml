[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror"
version = "0.1.0"
description = "Mirror, Mirror: a talking LED mirror"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "pygame",
    "requests",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
hw = ["sounddevice", "pyserial", "onnxruntime"]
tts = ["piper-tts[alignment]>=1.8,<2", "phonikud", "phonikud-onnx", "huggingface_hub"]
# The MMS Hebrew fallback voice only (tts.he_engine = "mms"). On the Orin, install
# NVIDIA's JetPack torch wheel first: deploy/setup_orin.sh --with-mms.
mms = ["transformers", "torch"]
dev = ["pytest", "responses"]

[project.scripts]
mirror-voice = "mirror.voice_main:main"
mirror-face = "mirror.face.app:main"

[tool.setuptools.packages.find]
include = ["mirror", "mirror.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real TTS model files (skips itself when missing)",
]
