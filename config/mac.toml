# Development config for macOS: windowed face, system default audio, log-only lights.
models_dir = "models"   # silero_vad.onnx + Hugging Face cache (hf/)

[audio]
sample_rate = 16000

[servers]
stt_url = "http://127.0.0.1:8081"
llm_url = "http://127.0.0.1:8080"
timeout_s = 20

[tts]
piper_voice_en = "models/en_US-lessac-medium.onnx"
he_engine = "phonikud"   # "phonikud" (a G2P + the Phonikud Piper voice) | "mms" (Meta MMS fallback)
he_g2p = "renikud"       # the voice's text->IPA stage: "renikud" (RenikudPlus) | "phonikud"
renikud_model = "models/renikud-plus.int8.onnx"
phonikud_model = "models/phonikud-1.0.int8.onnx"
phonikud_voice_he = "models/phonikud-tts-he.onnx"   # config: same path + ".json"
mms_model_he = "facebook/mms-tts-heb"
engine = "pocket"          # "piper" | "pocket" (Pocket TTS for both languages; the oracle's cloned voice)
pocket_model = "models/pocket-tts-english-ipa.onnx"
pocket_voice = "javert"   # built in: javert (CC0, deepest), michael (CC-BY), marius (CC0), ...
pocket_voice_file = "models/voices/mirror.npy"   # the oracle's voice (README: Pocket TTS); models/ is not in git
pocket_threads = 2
voice_speed = 1.0        # < 1 = deeper and slower (0.86 = the "villain" sample); 1.0 = off
voice_room = 0.0         # 0..1 small-room echo (1.0 = the "villain" sample); 0 = off

[face]
size = 252
screen_w = 1920   # unused when fullscreen = false
screen_h = 1080
fullscreen = false
window_scale = 3
bus_port = 7777
renderer = "sprite"           # "sprite" (face bank) | "procedural" (drawn lines)
bank = "assets/face/stub"     # face bank directory; relative to the repo root
float_enabled = true          # the face hovers: bob, sway and tilt, with a dissolving edge
float_amp_px = 5.0            # vertical bob +/- px at 252 (idle 1.0x, listening 0.7x, thinking 0.8x, speaking 0.45x)
float_period_s = 6.5          # bob period; sway runs at x1.37, tilt at x0.83
float_tilt_deg = 1.2          # +/- rotation
float_scale = 0.93            # whole face shrunk about the centre so the motion never clips
float_edge_feather_px = 6.0   # the outline fades into black over this many px
mist = true                   # a faint old-gold mist drifting on the black behind the face
mist_intensity = 0.10         # its brightest pixel, 0..1 of full brightness (keep low: the glass must still read as a mirror)
mist_color = [150, 110, 45]   # RGB hue (antique gold); scaled so its brightest channel = mist_intensity
mist_speed = 1.0              # drift rate (1.0: ~3 px/s, the wisps reshape over tens of seconds; 0 = still)

[lights]
kind = "log"
baud = 115200

[llm]
# sampling sent with each request (llama-server /v1/chat/completions)
temperature = 0.95
top_p = 0.95
min_p = 0.05
repeat_penalty = 1.12      # penalizes tokens repeated within the last 64
presence_penalty = 0.4
frequency_penalty = 0.3

[conversation]
listen_timeout_s = 8.0
followup_s = 6.0
max_reply_sentences = 3
max_reply_chars = 300
filler_enabled = true      # a short pre-synthesized line while the LLM thinks
filler_min_wait_s = 0.0    # skip the filler if a sentence is ready within this (0: always play)
world_file = "config/oracle_world.md"   # oracle background; relative to the repo root
lures_enabled = true       # now and then, while idle, murmur a short line to draw people in
lure_min_idle_s = 120      # no lure until this long after the last conversation
lure_interval_s = [180, 420]   # each wait between lures is drawn at random from this range
lure_quiet_hours = []      # local-time windows without lures, e.g. ["02:00-08:00", "22:30-01:00"]
