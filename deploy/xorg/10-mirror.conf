# Mirror, Mirror: the X server must never blank or power off the "monitor"
# (the NovaStar MSD300 sending card). Installed into /etc/X11/xorg.conf.d/ by
# deploy/setup_orin.sh. The face unit also runs `xset s off -dpms` at start.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
